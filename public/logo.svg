<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0px" y="0px"
	 viewBox="0 0 30 30" style="enable-background:new 0 0 30 30;" xml:space="preserve">
<defs>
  <style type="text/css">
    .st-bg{fill:#06CDBD;stroke:#FFFFFF;stroke-width:1.2;stroke-miterlimit:10;}
    .st-s{fill:#FFFFFF;}
    .st-m{fill:#0EA5E9;}
    .st-skew{transform: skew(-14deg, 0);}

    .sm-breathe {
      animation: breathe 2.5s ease-in-out infinite;
    }

    @keyframes breathe {
      0%, 100% { opacity: 0.88; }
      50% { opacity: 1; }
    }
  </style>
</defs>

<!-- Бирюзовый круг с белой обводкой -->
<circle class="st-bg" cx="15" cy="15" r="13.5"/>

<!-- Буквы S (белая) и M (голубая) — монограмма SakhMatrix,
     шрифт стилизован под Anton (heavy display sans),
     с наклоном -14deg как в логотипе шапки. -->
<g class="sm-breathe">
  <g class="st-skew">
    <!-- S — белая -->
    <path class="st-s" d="M13.5,9.2c-0.45-0.85-1.4-1.35-2.6-1.35c-1.7,0-2.9,0.85-2.9,2.15c0,1.2,0.85,1.85,2.9,2.3
      c2.05,0.45,4,1.1,4,3.4c0,2.15-1.8,3.5-4.25,3.5c-1.7,0-3.15-0.6-3.95-1.7l1.1-0.85
      c0.6,0.85,1.55,1.35,2.9,1.35c1.7,0,2.8-0.75,2.8-2.05c0-1.2-0.85-1.7-2.9-2.15
      c-2.15-0.45-4.1-1.2-4.1-3.5c0-2.05,1.8-3.35,4.25-3.35c1.55,0,2.9,0.6,3.6,1.55L13.5,9.2z"/>
    <!-- M — голубая, правее -->
    <path class="st-m" d="M23.8,22.8h-1.7v-9.4l-3.6,6.25h-0.4l-3.6-6.25v9.4h-1.7V11.7h2.15l3.35,5.9l3.35-5.9h2.15V22.8z"/>
  </g>
</g>
</svg>
